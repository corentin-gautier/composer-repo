name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [repos.json, scripts/**]
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.js
      - name: Commit packages.json when it changed
        run: |
          git diff --quiet packages.json && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "chore: update packages.json"
          git push
